name: Trivy Scan
on:
  workflow_call:
    inputs:
      repo-name:
        description: 'Name of the repository'
        required: false
        type: string

env:
    SCAN_SEVERITY: 'CRITICAL,HIGH,MEDIUM'
    SCAN_OUTPUT: 'trivy-results.json'
    ISSUE_OUTPUT: 'trivy-issue.md'
    SARIF_OUTPUT: 'trivy-results.sarif'

jobs:
    trivy-scan:
        runs-on: ubuntu-latest
        continue-on-error: true
        permissions:
            contents: read
            security-events: write
            issues: write
            pull-requests: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Run Trivy vulnerability scanner in fs mode
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                scan-type: 'config'
                scan-ref: '.'
                severity: ${{ env.SCAN_SEVERITY }}
                format: 'json'
                output: ${{ env.SCAN_OUTPUT }}
                cache: 'false'

            - run: echo "CURRENT_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

            - name: Format scan results for GitHub Issue
              if: always()
              run: |
                {
                  echo "# Trivy IaC Scan Results"
                  echo
                  echo "Scanned on: ${{ env.CURRENT_DATE }}"
                  echo
                  echo "| Severity | Check | Finding | File | Remediation |"
                  echo "| --- | --- | --- | --- | --- |"
                  jq -r '
                    .Results[]?
                    | .Target as $target
                    | .Misconfigurations[]?
                    | [
                        .Severity,
                        (.ID // "N/A"),
                        (.Title | gsub("\\|"; "\\\\|")),
                        ($target +
                          (if .CauseMetadata.StartLine then ":" + (.CauseMetadata.StartLine | tostring) else "" end)),
                        (if .PrimaryURL then "[View advisory](" + .PrimaryURL + ")" else "N/A" end)
                      ]
                    | "| " + join(" | ") + " |"
                  ' "${{ env.SCAN_OUTPUT }}"
                } > "${{ env.ISSUE_OUTPUT }}"

            - name: Generate SARIF results
              if: always()
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                scan-type: 'config'
                scan-ref: '.'
                severity: ${{ env.SCAN_SEVERITY }}
                format: 'sarif'
                output: ${{ env.SARIF_OUTPUT }}
                cache: 'false'

            - name: Create Issue From File
              uses: peter-evans/create-issue-from-file@v6
              with:
                title: Trivy Scan Results on ${{ env.CURRENT_DATE }}
                content-filepath: ${{ env.ISSUE_OUTPUT }}
                labels: |
                  trivy-scan

            # - name: Upload Trivy scan results to GitHub Security tab
            #   uses: github/codeql-action/upload-sarif@v4
            #   if: always()
            #   with:
            #     sarif_file: ${{ env.SARIF_OUTPUT }}
