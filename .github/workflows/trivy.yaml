name: Trivy Scan
on:
    workflow_call:
        inputs:
            repo-name:
                description: 'Name of the repository'
                required: false
                type: string

env:
    SCAN_SEVERITY: 'CRITICAL,HIGH,MEDIUM'
    SCAN_FORMAT: 'sarif'
    SCAN_OUTPUT: 'trivy-results.sarif'
    SCAN_COMMENT_FORMAT: 'table'
    SCAN_COMMENT_OUTPUT: 'trivy-results.txt'

jobs:
    trivy-scan:
        runs-on: ubuntu-latest
        continue-on-error: true
        permissions:
            contents: read
            security-events: write
            issues: write
            pull-requests: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Run Trivy vulnerability scanner in fs mode
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                scan-type: 'config'
                scan-ref: '.'
                severity: ${{ env.SCAN_SEVERITY }}
                format: ${{ env.SCAN_FORMAT }}
                output: ${{ env.SCAN_OUTPUT }}

            - name: Generate Trivy text report for PR comment
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                scan-type: 'config'
                scan-ref: '.'
                severity: ${{ env.SCAN_SEVERITY }}
                format: ${{ env.SCAN_COMMENT_FORMAT }}
                output: ${{ env.SCAN_COMMENT_OUTPUT }}

            - name: Comment Trivy results on PR
              if: always() && github.event_name == 'pull_request'
              uses: actions/github-script@v7
              with:
                github-token: ${{ secrets.GITHUB_TOKEN }}
                script: |
                  const fs = require('fs');
                  const filePath = process.env.SCAN_COMMENT_OUTPUT || 'trivy-results.txt';

                  const prNumber = context.payload.pull_request?.number;
                  if (!prNumber) {
                    core.info('No pull request context found. Skipping PR comment.');
                    return;
                  }

                  if (fs.existsSync(filePath) && fs.statSync(filePath).size > 0) {
                    const results = fs.readFileSync(filePath, 'utf8');
                    const truncatedResults =
                      results.length > 65000
                        ? results.substring(0, 65000) + '\n\n**Output truncated...**'
                        : results;

                    const commentBody = [
                      '### Security Scan Results',
                      '',
                      '<details>',
                      '<summary>Click to expand scan details</summary>',
                      '',
                      '```',
                      truncatedResults,
                      '```',
                      '',
                      '</details>',
                      '',
                      'Please review the reported issues before merging.'
                    ].join('\n');

                    await github.rest.issues.createComment({
                      issue_number: prNumber,
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      body: commentBody
                    });
                  } else {
                    await github.rest.issues.createComment({
                      issue_number: prNumber,
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      body: 'No CRITICAL, HIGH, or MEDIUM vulnerabilities found in the scan.'
                    });
                  }

            - name: Upload Vulnerability Scan Results
              uses: actions/upload-artifact@v4
              with:
                name: trivy-report
                path: ${{ env.SCAN_OUTPUT }}
                retention-days: 5

            - name: Upload Trivy scan results to GitHub Security tab
              uses: github/codeql-action/upload-sarif@v4
              if: always()
              with:
                sarif_file: ${{ env.SCAN_OUTPUT }}
